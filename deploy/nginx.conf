# Meta subscription verification carries a secret in its query string.
# Keep a route-only access record for this endpoint; API logging also excludes queries.
log_format tuition_webhook_safe '$remote_addr [$time_local] "$request_method /api/tuition/notifications/whatsapp/webhook $server_protocol" $status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Only this exact cloudflared peer may replace the socket address.
  set_real_ip_from ${ACCESS_LOG_TRUSTED_TUNNEL_IP};
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  location = /api/tuition/notifications/whatsapp/webhook {
    access_log /var/log/nginx/access.log tuition_webhook_safe;
    # Upstream-error diagnostics include the original query; the route access/API logs retain sanitized status instead.
    error_log /dev/null;
    client_max_body_size 64k;
    proxy_pass http://api:4181/api/tuition/notifications/whatsapp/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:4181/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location /icons/ {
    try_files $uri =404;
  }
}
