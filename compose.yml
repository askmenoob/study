name: imai-study
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imai_study
      POSTGRES_USER: imai_study
      POSTGRES_PASSWORD: ${STUDY_DB_PASSWORD}
    volumes:
      - ${STUDY_DATA_DIR:-/mnt/data/data/imai-study}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imai_study -d imai_study"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      study:
        ipv4_address: 172.25.0.2

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 4181
      DATABASE_URL: postgresql://imai_study:${STUDY_DB_PASSWORD}@postgres:5432/imai_study
      JWT_SECRET: ${STUDY_JWT_SECRET}
      JOIN_CODE_ENCRYPTION_KEY_FILE: /run/secrets/class_code_key
      ACCESS_LOG_TRUSTED_PROXY_IPS: ${STUDY_ACCESS_LOG_TRUSTED_PROXY_IPS:-172.25.0.4}
      FRONTEND_ORIGIN: ${STUDY_FRONTEND_ORIGIN:-https://study.imai.my}
      FREE_AI_ONLY: "true"
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Sulafat}
      TTS_CACHE_DIR: /app/data/tts-cache
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4181:4181"
    volumes:
      - ${STUDY_DATA_DIR:-/mnt/data/data/imai-study}/tts-cache:/app/data/tts-cache
      - ./secrets/gemini-api-key:/run/secrets/gemini_api_key:ro
      - ./secrets/class-code-key:/run/secrets/class_code_key:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4181/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      study:
        ipv4_address: 172.25.0.3

  web:
    environment:
      ACCESS_LOG_TRUSTED_TUNNEL_IP: ${STUDY_ACCESS_LOG_TRUSTED_TUNNEL_IP:-172.25.0.1}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4178:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      study:
        ipv4_address: 172.25.0.4

  tunnel:
    image: cloudflare/cloudflared:2026.8.3
    user: "1000:1000"
    restart: unless-stopped
    command:
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - tunnel
      - run
    volumes:
      - ./deploy/cloudflared-study.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflare-tunnel.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      web:
        condition: service_healthy
    network_mode: host

networks:
  study:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
