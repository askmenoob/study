name: Study verification
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tuition_qa
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: exam_qa_study
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U tuition_qa -d exam_qa_study"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EXAM_TEST_DATABASE_URL: postgresql://tuition_qa:synthetic_ci_password@127.0.0.1:55438/exam_qa_study
      CHALLENGE_TEST_DATABASE_URL: postgresql://tuition_qa:synthetic_ci_password@127.0.0.1:55438/exam_qa_study
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:curriculum
      - run: npm run validate:library
      - run: npm test -- --maxWorkers=2
